<body class="antialiased pb-24">

    <!-- Header -->
    <header id="header" class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-600/20">
                <i class="fa-solid fa-store text-lg"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold">فروشگاه الگانس</h1>
                <p class="text-[10px] text-slate-500">پنل مدیریت سفارشات</p>
            </div>
        </div>
        <button class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500">
            <i class="fa-solid fa-bell"></i>
        </button>
    </header>

    <main class="p-6">
        <!-- Stats Grid -->
        <section class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-[10px] text-slate-500 block mb-1">فروش امروز</span>
                <span class="text-lg font-bold text-slate-900">۴,۲۰۰,۰۰۰</span>
                <span class="text-[8px] text-emerald-600 mr-1 font-bold">+۱۲٪</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-[10px] text-slate-500 block mb-1">سفارشات جدید</span>
                <span class="text-lg font-bold text-slate-900">۸</span>
                <span class="text-[8px] text-blue-600 mr-1 font-bold">فعال</span>
            </div>
        </section>

        <!-- Orders Section -->
        <section id="orders">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-sm font-bold text-slate-900">آخرین سفارشات</h2>
                <div class="flex gap-2">
                    <button class="px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold rounded-lg border border-blue-100">همه</button>
                    <button class="px-3 py-1 bg-white text-slate-500 text-[10px] font-bold rounded-lg border border-slate-200">تایید نشده</button>
                </div>
            </div>

            <div class="space-y-4">
                <!-- Order Item 1 -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-lg bg-slate-50 overflow-hidden border border-slate-100">
                                <img class="w-full h-full object-cover" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_8494b563bc_17ddccea68d350ba.png" alt="minimalist watch product photo">
                            </div>
                            <div>
                                <h3 class="text-xs font-bold">ساعت مچی الیت</h3>
                                <p class="text-[9px] text-slate-500">کد سفارش: #KD-۱۰۲</p>
                            </div>
                        </div>
                        <span class="px-2 py-1 bg-amber-50 text-amber-600 text-[9px] font-bold rounded-md">بررسی رسید</span>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                        <div class="text-[10px] text-slate-500">مشتری: <span class="text-slate-900 font-medium">نیکان</span></div>
                        <button class="text-[10px] font-bold text-blue-600 flex items-center gap-1">
                            مشاهده جزئیات
                            <i class="fa-solid fa-arrow-left text-[8px]"></i>
                        </button>
                    </div>
                </div>

                <!-- Order Item 2 -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-lg bg-slate-50 overflow-hidden border border-slate-100">
                                <img class="w-full h-full object-cover" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_13c20177dc_636b5f8b1c097648.png" alt="ceramic vase minimalist product photo">
                            </div>
                            <div>
                                <h3 class="text-xs font-bold">گلدان سرامیکی</h3>
                                <p class="text-[9px] text-slate-500">کد سفارش: #KD-۱۰۱</p>
                            </div>
                        </div>
                        <span class="px-2 py-1 bg-emerald-50 text-emerald-600 text-[9px] font-bold rounded-md">تایید شده</span>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                        <div class="text-[10px] text-slate-500">مشتری: <span class="text-slate-900 font-medium">سهراب</span></div>
                        <button class="text-[10px] font-bold text-blue-600 flex items-center gap-1">
                            مشاهده جزئیات
                            <i class="fa-solid fa-arrow-left text-[8px]"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Quick Actions -->
        <section class="mt-8">
            <button class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold flex items-center justify-center gap-2 shadow-xl shadow-slate-900/10">
                <i class="fa-solid fa-plus text-sm"></i>
                افزودن محصول جدید
            </button>
        </section>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 px-8 py-3 flex items-center justify-between z-50">
        <div class="flex flex-col items-center gap-1 text-blue-600">
            <i class="fa-solid fa-chart-pie text-lg"></i>
            <span class="text-[9px] font-bold">داشبورد</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-box-open text-lg"></i>
            <span class="text-[9px] font-bold">محصولات</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-receipt text-lg"></i>
            <span class="text-[9px] font-bold">سفارشات</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-gear text-lg"></i>
            <span class="text-[9px] font-bold">تنظیمات</span>
        </div>
    </nav>


  <script>
